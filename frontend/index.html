<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23f59e0b'><path d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anatoma3D — Interactive 3D Human Anatomy Platform</title>
    <style>
      /* Zero-Latency Instant Medical Splash Screen */
      body {
        margin: 0;
        padding: 0;
        background-color: #090a0d;
        color: #f1f5f9;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        overflow-x: hidden;
      }
      #splash-container {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #090a0d;
        z-index: 99999;
      }
      .splash-logo-box {
        position: relative;
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background: #12141a;
        border: 1px solid #222734;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        margin-bottom: 20px;
      }
      .splash-pulse-ring {
        position: absolute;
        inset: -6px;
        border-radius: 24px;
        border: 2px solid rgba(245, 158, 11, 0.35);
        animation: pulseRing 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes pulseRing {
        0%, 100% { transform: scale(1); opacity: 0.35; }
        50% { transform: scale(1.12); opacity: 0.85; }
      }
      .splash-title {
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #ffffff;
        margin-bottom: 6px;
      }
      .splash-title span {
        color: #f59e0b;
      }
      .splash-subtitle {
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #94a3b8;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        margin-bottom: 24px;
      }
      .splash-bar-track {
        width: 180px;
        height: 3px;
        background: #181b24;
        border-radius: 9999px;
        overflow: hidden;
        border: 1px solid #252b3b;
      }
      .splash-bar-fill {
        height: 100%;
        width: 40%;
        background: linear-gradient(90deg, #f59e0b, #fbbf24);
        border-radius: 9999px;
        box-shadow: 0 0 12px rgba(245, 158, 11, 0.7);
        animation: barSlide 1.4s ease-in-out infinite alternate;
      }
      @keyframes barSlide {
        0% { transform: translateX(0%); width: 25%; }
        100% { transform: translateX(300%); width: 45%; }
      }
    </style>
  </head>
  <body class="bg-[#070a12] text-slate-100">
    <div id="root">
      <div id="splash-container">
        <div class="splash-logo-box">
          <div class="splash-pulse-ring"></div>
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
        </div>
        <div class="splash-title">ANATOMA<span>3D</span></div>
        <div class="splash-subtitle">Surgical Platform Initializing</div>
        <div class="splash-bar-track">
          <div class="splash-bar-fill"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
